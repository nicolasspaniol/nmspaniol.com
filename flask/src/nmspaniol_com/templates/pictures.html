{% extends "base.html" %}

{% block title %}Pictures - Nícolas Spaniol{% endblock %}

{% block main %}
    {% for row_height, picture_row in layout %}
        <div class="flex flex-col md:flex-row gap-1 mb-1 w-full md:h-[var(--row-height)]" style="--row-height: {{ row_height }}rem">
            {% for picture in picture_row %}
                <a href="{{ url_for('static', filename=picture.path) }}" class="w-auto h-full" target="_blank">
                    <img
                        class="w-full md:h-full object-contain md:w-auto"
                        src="{{ url_for('static', filename=picture.thumb) }}"
                        {% if picture.title %} title="{{ picture.title }}" {% endif %}
                    >
                </a>
            {% endfor %}
        </div>
    {% endfor %}
{% endblock %}
