server {
    listen                443 ssl;
    server_name           nmspaniol.com;
    ssl_certificate       /etc/letsencrypt/live/nmspaniol.com/fullchain.pem;
    ssl_certificate_key   /etc/letsencrypt/live/nmspaniol.com/privkey.pem;

    location / {
        proxy_pass http://$FLASK_SERVER_ADDR;
    }
}

server {
    location / {
        return 301 https://$host$request_uri;
    }

    listen                80;
    server_name           nmspaniol.com;
    return 404;
}

